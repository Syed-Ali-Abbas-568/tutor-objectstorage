# https://packaging.python.org/en/latest/tutorials/packaging-projects/
# https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-objectstorage"
license = { text = "AGPL-3.0-only" }
requires-python = ">= 3.9"
authors = [
  {name = "Edly"}, {email = "hello@edly.io"},
]
description = "A Tutor plugin for Open edX object storage: RustFS, Azure Blob Storage (via rclone), or any external S3-compatible provider, picked with one config key"
readme = {file = "README.rst", content-type = "text/x-rst"}
maintainers = [
    { name = "Syed Ali Abbas" }, { email = "ali.abbas02@arbisoft.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
  # Supports Tutor 21.x and 22.x, both verified directly: full test suite,
  # a real `tutor config save` (including the azure risk-gate hard-fail),
  # and the exact internal mechanics this plugin depends on (load_minimal()
  # vs. load_full()'s CONFIG_DEFAULTS timing, CONFIG_LOADED's firing point,
  # CLI_DO_INIT_TASKS's per-tuple execution) read directly from Tutor 22.0.2's
  # own source and confirmed byte-identical to 21.x. Tutor 22.x itself
  # requires Python >=3.10 (a constraint Tutor's own packaging enforces, not
  # this one) - a Python 3.9 environment resolves to the latest 21.x
  # automatically, so the existing 3.9/3.12 CI matrix below exercises both
  # major versions without needing a third entry. Not yet tested against
  # 23.x, which is still Tutor's unreleased main branch.
  "tutor>=21.0.0,<23.0.0",
]
# these fields will be set by hatch_build.py
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "tutor[dev]>=21.0.0,<23.0.0",
  "ruff",
  "pytest",
  "pyyaml",
]

[project.entry-points."tutor.plugin.v1"]
objectstorage = "tutorobjectstorage.plugin"

# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
[project.urls]
Homepage = "https://docs.tutor.edly.io/"
Documentation = "https://docs.tutor.edly.io/"
Community = "https://discuss.openedx.org/tag/tutor"

# hatch-specific configuration
[tool.hatch.metadata.hooks.custom]
path = ".hatch_build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = [ "/tutorobjectstorage", ".hatch_build.py"]
exclude = ["tests*"]

[tool.hatch.build.targets.wheel]
packages = ["tutorobjectstorage"]

[tool.ruff]
exclude = ["templates", "docs/_ext"]

[tool.ruff.lint]
# E: pycodestyle errors
# I: isort
# N: pep8-naming
select = ["E", "I", "N"]

# F401: unused-import
# F841: unused-variable
# W292: missing-newline-at-end-of-file
extend-select = ["F401", "F841", "W292"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
